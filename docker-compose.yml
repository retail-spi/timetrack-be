version: '3.8'

# TimeTrack — Francois Dive <divefrancois@gmail.com> — SPI Global Play Retail 2026
# Usage :
#   cp .env.example .env          (adapter les secrets)
#   docker compose up --build -d  (premier lancement)
#   docker compose logs -f        (voir les logs)
#   docker compose down -v        (arrêt + suppression volumes)

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB:       ${POSTGRES_DB:-timetrack}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── API NestJS ──────────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL:  postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-timetrack}
      JWT_SECRET:    ${JWT_SECRET:-changeme_dev_only_not_for_prod}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT:          3000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Web Next.js ─────────────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      # URL interne (server-side) vers l'API — via le réseau Docker
      API_URL: http://api:3000/api/v1
    depends_on:
      - api
    restart: unless-stopped

  # ── Nginx (reverse proxy) ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
